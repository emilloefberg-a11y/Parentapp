<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Hjälp en förälder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: mobilförst app-skal – en lugn kolumn (max 640px) med bottennavigering; på desktop blir navigeringen en vänsterspalt. */
:root{
  --blue:#4A90C2;          /* varumärkesblå – ytor, ikoner, dekor */
  --primary:#2B6C9C;       /* djupare blå för knappar & länkar (AA-kontrast mot vitt) */
  --on-primary:#FFFFFF;
  --navy:#173B57;
  --sky:#DCEFF8;
  --bg:#FAFCFD;
  --surface:#FFFFFF;
  --surface-2:#F0F6FA;
  --line:#E2EBF1;
  --line-strong:#B9CCDA;
  --text:#173B57;
  --muted:#557087;
  --green:#6FAF8F; --green-ink:#2C6E4E; --green-soft:#E5F3EB;
  --peach:#F4A77B; --peach-ink:#9A4B22; --peach-soft:#FDEEE4;
  --red-ink:#A33636; --red-soft:#FBEDED; --red-line:#F0CACA;
  --t-grav:#ECEAF8; --t-01:#DCEFF8; --t-15:#E3F2EA; --t-69:#FCEBDF; --t-1012:#DEF0EF; --t-1315:#F5E6EC; --t-1618:#E5EAF3;
  --nav-bg:rgba(255,255,255,.92);
  --shadow:0 1px 2px rgba(23,59,87,.05),0 8px 24px rgba(23,59,87,.06);
  --focus:#4A90C2;
  --f-display:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --blue:#6FAEDC; --primary:#7DB9E6; --on-primary:#0C1A25; --navy:#E4EDF4; --sky:#1A3346;
  --bg:#0C1822; --surface:#12212D; --surface-2:#182B3A; --line:#223747; --line-strong:#3A5468;
  --text:#E4EDF4; --muted:#9DB3C4;
  --green-ink:#8FD2AE; --green-soft:#17332A; --peach-ink:#F5B993; --peach-soft:#36271D;
  --red-ink:#F2A3A3; --red-soft:#3A1E22; --red-line:#5C2E33;
  --t-grav:#25293F; --t-01:#1A3346; --t-15:#1B362B; --t-69:#3A2A20; --t-1012:#193636; --t-1315:#36232C; --t-1618:#212B3B;
  --nav-bg:rgba(18,33,45,.92); --shadow:0 1px 2px rgba(0,0,0,.3); --focus:#7DB9E6; color-scheme:dark }
}
:root[data-theme="dark"]{
  --blue:#6FAEDC; --primary:#7DB9E6; --on-primary:#0C1A25; --navy:#E4EDF4; --sky:#1A3346;
  --bg:#0C1822; --surface:#12212D; --surface-2:#182B3A; --line:#223747; --line-strong:#3A5468;
  --text:#E4EDF4; --muted:#9DB3C4;
  --green-ink:#8FD2AE; --green-soft:#17332A; --peach-ink:#F5B993; --peach-soft:#36271D;
  --red-ink:#F2A3A3; --red-soft:#3A1E22; --red-line:#5C2E33;
  --t-grav:#25293F; --t-01:#1A3346; --t-15:#1B362B; --t-69:#3A2A20; --t-1012:#193636; --t-1315:#36232C; --t-1618:#212B3B;
  --nav-bg:rgba(18,33,45,.92); --shadow:0 1px 2px rgba(0,0,0,.3); --focus:#7DB9E6; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,select{font:inherit;color:inherit}
a{color:var(--primary)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.85rem;line-height:1.15;font-weight:800}
h2{font-size:1.25rem;line-height:1.25;font-weight:750}
h3{font-size:1.05rem;line-height:1.3;font-weight:700}
p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
.i{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* App shell */
#app{min-height:100%}
main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:28px;padding-top:12px;animation:enter .22s ease-out}
@keyframes enter{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}

.tabbar{position:fixed;z-index:20;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));background:var(--nav-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:600;color:var(--muted);padding:4px 0;min-height:52px;justify-content:center;text-align:center}
.tab .pill{display:grid;place-items:center;width:56px;height:30px;border-radius:999px;transition:background .2s}
.tab[aria-current="page"]{color:var(--primary)}
.tab[aria-current="page"] .pill{background:var(--sky)}
.brand-rail{display:none}
body.ob .tabbar{display:none}
body.ob main{padding-bottom:32px}

@media (min-width:900px){
  #app{display:grid;grid-template-columns:260px 1fr}
  .tabbar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:28px 16px;border-top:0;border-right:1px solid var(--line);backdrop-filter:none;background:var(--surface)}
  .brand-rail{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font-family:var(--f-display);font-weight:800;font-size:1.05rem}
  .tab{flex-direction:row;justify-content:flex-start;gap:10px;font-size:.98rem;padding:6px 8px;min-height:48px;border-radius:14px}
  .tab .pill{width:40px;height:34px}
  .tab[aria-current="page"]{background:var(--sky)}
  .tab[aria-current="page"] .pill{background:transparent}
  main{max-width:720px;padding-bottom:64px}
  body.ob #app{display:block}
  body.ob .tabbar{display:none}
}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:8px;margin-inline:-16px;padding:10px 12px;background:var(--nav-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent}
.top-t{flex:1;min-width:0;font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:var(--text)}
.icon-btn:hover{background:var(--surface-2)}
.back{display:flex;align-items:center;gap:2px;height:44px;padding:0 10px 0 4px;border-radius:14px;font-weight:600;color:var(--primary);max-width:40%;white-space:nowrap;overflow:hidden}
.back span{overflow:hidden;text-overflow:ellipsis}
.back:hover{background:var(--surface-2)}
.spacer44{width:44px;flex:none}

/* Headings / text */
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);font-weight:600}
.crumb button{color:var(--primary);font-weight:600}
.lead{font-size:1.08rem;color:var(--muted);line-height:1.55;max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h .link{font-weight:600;font-size:.92rem;color:var(--primary)}

/* Cards & rows */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;min-height:64px;text-decoration:none;color:inherit}
.list > .row + .row, .list > * + .row{border-top:1px solid var(--line)}
.row:hover{background:var(--surface-2)}
.row-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-t{font-weight:650;line-height:1.3}
.row-s{font-size:.88rem;color:var(--muted);line-height:1.4}
.chev{color:var(--line-strong)}
.ico{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;background:var(--surface-2)}
.ico.sm{width:36px;height:36px;border-radius:11px;font-size:1.05rem}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sky);color:var(--primary);white-space:nowrap}
.badge.green{background:var(--green-soft);color:var(--green-ink)}
.badge.peach{background:var(--peach-soft);color:var(--peach-ink)}
.badge.grey{background:var(--surface-2);color:var(--muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:15px;background:var(--primary);color:var(--on-primary);font-weight:700;text-align:center;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.line{background:transparent;border:1.5px solid var(--line-strong);color:var(--text)}
.btn.sm{min-height:40px;padding:0 14px;border-radius:12px;font-size:.92rem}
.btn.danger{background:var(--red-soft);color:var(--red-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sky);border-color:var(--blue);color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.scroll-x{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}

/* Home */
.home-top{display:flex;align-items:center;justify-content:space-between;padding-top:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1rem}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sky);color:var(--primary);font-weight:800;font-family:var(--f-display)}
.hello{display:flex;flex-direction:column;gap:6px}
.kids{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px}
.kid{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;white-space:nowrap;min-height:44px}
.kid .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:.95rem}
.kid[aria-pressed="true"]{border-color:var(--blue);background:var(--sky);color:var(--primary)}
.hero{border-radius:26px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:16px;background:var(--t-01)}
.hero-h{display:flex;gap:14px;align-items:center}
.hero-h .ico{background:var(--surface);width:52px;height:52px;border-radius:16px;font-size:1.6rem}
.hero-name{font-family:var(--f-display);font-size:1.4rem;font-weight:800;line-height:1.15}
.now{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;overflow:hidden}
.now .row{min-height:58px;padding:12px 14px}
.now .row + .row{border-top:1px solid var(--line)}
.now .row-t{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.now .row-s{color:var(--text);font-size:.95rem}
.searchbar{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 18px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);color:var(--muted);box-shadow:var(--shadow)}
.searchbar:hover{border-color:var(--line-strong)}
.helpbtn{display:flex;align-items:center;gap:16px;width:100%;padding:18px;border-radius:var(--r-lg);background:var(--peach-soft);color:var(--text)}
.helpbtn .ico{background:var(--surface);width:52px;height:52px;font-size:1.5rem}
.helpbtn b{font-family:var(--f-display);font-size:1.15rem;font-weight:800;display:block}
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.qbtn{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:14px 4px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-weight:650;font-size:.78rem;text-align:center;min-height:88px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.meta .badge{white-space:normal}
.qbtn span.e{font-size:1.5rem}
.qbtn:hover{border-color:var(--line-strong)}
.todo{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px}
.list > .todo + .todo{border-top:1px solid var(--line)}
.todo .row-b{cursor:pointer}
.todo.done .row-t{text-decoration:line-through;color:var(--muted)}

/* Progress */
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog > i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.prog.done > i{background:var(--green)}
.lcard{display:flex;flex-direction:column;gap:10px;padding:16px;width:100%}
.lcard-h{display:flex;align-items:center;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}

/* Section pages */
.shero{border-radius:26px;padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--surface-2);overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;min-height:42px;padding:0 12px;border-radius:12px;font-weight:650;font-size:.9rem;white-space:nowrap;text-align:center;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(23,59,87,.12)}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);min-height:128px}
.cat:hover{border-color:var(--line-strong)}
.cat .row-t{font-family:var(--f-display);font-weight:750}
.soon{display:flex;flex-wrap:wrap;gap:8px}
.soon span{font-size:.88rem;padding:6px 12px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:600}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--surface-2);font-size:.92rem;color:var(--muted);line-height:1.5}
.note b{color:var(--text)}

/* Article */
.article{display:flex;flex-direction:column;gap:18px}
.article h1{font-size:1.9rem}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prose{display:flex;flex-direction:column;gap:14px;max-width:65ch;font-size:1.04rem;line-height:1.65}
.prose h2{margin-top:14px;font-size:1.2rem}
.prose ul,.prose ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.prose li::marker{color:var(--blue)}
.callout{border-radius:var(--r-md);padding:16px 18px;display:flex;flex-direction:column;gap:8px;font-size:.98rem;line-height:1.55}
.callout h3{display:flex;align-items:center;gap:8px;font-size:1rem}
.callout ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
.callout.ok{background:var(--green-soft)} .callout.ok h3{color:var(--green-ink)}
.callout.care{background:var(--peach-soft)} .callout.care h3{color:var(--peach-ink)}
.callout.sos{background:var(--red-soft);border:1px solid var(--red-line)} .callout.sos h3{color:var(--red-ink)}
.callout.tip{background:var(--sky)}
.callout.info{background:var(--surface-2)}
.tl{display:flex;flex-direction:column;gap:0;margin:4px 0}
.tl-i{display:grid;grid-template-columns:28px 1fr;gap:12px}
.tl-dot{display:flex;flex-direction:column;align-items:center}
.tl-dot i{width:14px;height:14px;border-radius:50%;background:var(--blue);border:3px solid var(--sky);margin-top:5px;flex:none}
.tl-dot b{flex:1;width:2px;background:var(--line);margin:4px 0}
.tl-i:last-child .tl-dot b{display:none}
.tl-c{padding-bottom:18px;display:flex;flex-direction:column;gap:4px}
.tl-c strong{font-family:var(--f-display);font-size:1.02rem}
.sw{display:flex;flex-direction:column;gap:8px}
.sw-i{display:flex;align-items:center;gap:12px}
.sw-i i{width:28px;height:28px;border-radius:9px;flex:none;border:1px solid rgba(0,0,0,.08)}
.src{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--line);font-size:.9rem;color:var(--muted)}
.src b{color:var(--text)}
.contacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contact{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--text)}
.contact strong{font-family:var(--f-display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.contact.sos strong{color:var(--red-ink)}
.contact span{font-size:.84rem;color:var(--muted);line-height:1.35}

/* Checklist */
.cl-head{display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.cl-top{display:flex;align-items:center;gap:14px}
.cl-count{font-variant-numeric:tabular-nums;font-weight:700}
.cl-actions{display:flex;flex-wrap:wrap;gap:8px}
.saved{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--green-ink);font-weight:600;transition:opacity .3s}
.saved.pulse{animation:pulse .8s}
@keyframes pulse{0%{opacity:.3}100%{opacity:1}}
.grp-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px}
.grp-h h2{font-size:1.02rem}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:58px}
.list > .item + .item, .list > .item + form, .list > .empty + form{border-top:1px solid var(--line)}
.item .tgl{display:flex;align-items:center;gap:14px;flex:1;min-width:0;min-height:44px;cursor:pointer}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.done .chk,.chk.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.item .txt{flex:1;min-width:0;line-height:1.35;overflow-wrap:anywhere}
.item.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.item .own{font-size:.7rem}
.edit-in{flex:1;min-width:0;min-height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.edit-in:focus{border-color:var(--blue);outline:none}
.mini{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.mini:hover{background:var(--surface-2);color:var(--text)}
.mini:disabled{opacity:.3;cursor:default}
.mini.del:hover{color:var(--red-ink);background:var(--red-soft)}
.addf{display:flex;gap:8px;padding:10px 12px}
.addf input{flex:1;min-width:0;min-height:48px;padding:0 14px;border-radius:14px;border:1.5px dashed var(--line-strong);background:transparent}
.addf input:focus{border-style:solid;border-color:var(--blue);outline:none;background:var(--surface)}
.empty{padding:16px;color:var(--muted);font-size:.92rem}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:650;font-size:.95rem}
.field input{min-height:52px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.field input:focus{border-color:var(--blue);outline:none}
.hint{font-size:.85rem;color:var(--muted)}
.err{font-size:.88rem;color:var(--red-ink);font-weight:600}
.confirm{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:var(--r-md);background:var(--red-soft);border:1px solid var(--red-line)}

/* Compare */
.prod{display:flex;flex-direction:column;gap:14px;padding:18px}
.prod-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.prod-h .row-b{gap:2px}
.brandname{font-size:.8rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.price{font-family:var(--f-display);font-weight:800;font-size:1.1rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:0}
.specs div{display:flex;flex-direction:column;min-width:0}
.specs dt{font-size:.78rem;color:var(--muted);font-weight:600}
.specs dd{margin:0;font-weight:600;font-size:.94rem;overflow-wrap:anywhere}
.pc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;font-size:.9rem}
.pc ul{margin:4px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:3px;color:var(--muted)}
.pc b{font-size:.82rem}
.match{display:flex;flex-wrap:wrap;gap:6px}
.selbtn{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:650;color:var(--primary)}
.selbtn .chk{width:24px;height:24px}
.cbar{position:fixed;z-index:15;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:608px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 18px;border-radius:18px;background:var(--navy);color:var(--bg);box-shadow:0 10px 30px rgba(23,59,87,.25)}
.cbar .btn{background:var(--bg);color:var(--navy);min-height:44px}
.cbar span{flex:1;font-weight:650}
@media (min-width:900px){.cbar{left:276px;bottom:24px;max-width:688px}}
.tbl-wrap{overflow-x:auto;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface)}
table.cmp{border-collapse:collapse;min-width:100%;font-size:.92rem}
.cmp th,.cmp td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);min-width:150px}
.cmp tr:last-child td,.cmp tr:last-child th{border-bottom:0}
.cmp th[scope="row"]{position:sticky;left:0;background:var(--surface-2);font-weight:650;min-width:110px;color:var(--muted);font-size:.84rem}
.cmp thead th{font-family:var(--f-display);font-size:1rem}
.cmp ul{margin:0;padding-left:1em}

/* Recipes */
.rcard{display:flex;gap:14px;align-items:center;padding:14px 16px;width:100%}
.rmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}

/* Search */
.sfield{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 16px;border-radius:18px;border:2px solid var(--blue);background:var(--surface)}
.sfield input{flex:1;min-width:0;border:0;background:transparent;font-size:1.05rem;min-height:52px;outline:none}
.rgrp{display:flex;flex-direction:column;gap:8px}

/* Onboarding */
.ob-wrap{min-height:100%;display:flex;flex-direction:column;gap:28px;padding-top:28px;max-width:520px;margin:0 auto}
.ob-hero{border-radius:30px;padding:30px 24px;background:var(--sky);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.ob-hero h1{font-size:2.1rem}
.ob-art{position:absolute;right:-30px;top:-30px;width:170px;height:170px;border-radius:50%;background:var(--blue);opacity:.18}
.ob-art.b{right:40px;top:70px;width:70px;height:70px;background:var(--peach);opacity:.35}
.vp{display:flex;flex-direction:column;gap:14px}
.vp-i{display:flex;gap:14px;align-items:center}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--line-strong)}
.dots i.on{width:24px;background:var(--primary)}
.typesel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.typesel button{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.typesel button span{font-size:1.5rem}
.typesel button[aria-pressed="true"]{border-color:var(--blue);background:var(--sky);color:var(--primary)}

/* Toast */
#toast{position:fixed;z-index:40;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;padding:12px 14px 12px 18px;border-radius:16px;background:var(--navy);color:var(--bg);font-weight:600;transition:all .25s;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--sky);font-weight:800;padding:6px 8px}
:root[data-theme="dark"] #toast button{color:var(--primary)}
@media (min-width:900px){#toast{bottom:32px;left:calc(50% + 130px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const isoToday = () => { const d = today(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtDate = s => parseD(s).toLocaleDateString('sv-SE', {day:'numeric', month:'long', year:'numeric'});

function ageInfo(c){
  if(!c) return null;
  const t = today();
  if(c.type === 'expecting'){
    const days = Math.round((parseD(c.date) - t)/864e5);
    const w = Math.max(1, Math.min(42, Math.floor((280 - days)/7) + 1));
    return {kind:'grav', sec:'grav', period:null, week:w, days, label: days >= 0 ? `Graviditetsvecka ${w}` : 'Beräknat datum har passerat', key:'grav'};
  }
  const b = parseD(c.date);
  let m = (t.getFullYear()-b.getFullYear())*12 + (t.getMonth()-b.getMonth()); if(t.getDate() < b.getDate()) m--; m = Math.max(0, m);
  const days = Math.floor((t - b)/864e5);
  let label;
  if(m < 1){ const w = Math.floor(days/7); label = w < 1 ? `${days} ${days===1?'dag':'dagar'}` : `${w} ${w===1?'vecka':'veckor'}`; }
  else if(m < 12) label = `${m} ${m===1?'månad':'månader'}`;
  else if(m < 24) label = m===12 ? '1 år' : `1 år och ${m-12} mån`;
  else label = `${Math.floor(m/12)} år`;
  const sec = m<12?'0-1': m<72?'1-5': m<120?'6-9': m<156?'10-12': m<192?'13-15':'16-18';
  const period = sec==='0-1' ? Math.min(3, Math.floor(m/3)) : sec==='1-5' ? Math.min(4, Math.max(0, Math.floor(m/12)-1)) : null;
  return {kind:'born', months:m, label, sec, period, key: sec==='0-1' ? 'p'+period : sec};
}

function makeList(def){

  Object.entries(def.g).forEach(([g, arr]) => arr.forEach((text,i) => items.push({id:def.id+'-'+g.slice(0,3)+i, text, done:false, custom:false, g})));
  return {id:def.id, e:def.e, t:def.t, sec:def.sec, d:def.d, builtin:true, items};
}
function getList(id){
  if(S.lists[id]) return S.lists[id];
  const def = LIST_DEFS.find(l=>l.id===id); if(!def) return null;
  return makeList(def);
}

function allLists(){ return [...LIST_DEFS.map(d=>getList(d.id)), ...S.order.map(id=>S.lists[id]).filter(Boolean)]; }
const progress = l => { const n = l.items.length, d = l.items.filter(i=>i.done).length; return {n, d, pct: n ? Math.round(d/n*100) : 0}; };
function groupsOf(l){

}

const STOP = new Set('vad ska jag när kan mitt min mina till med och att det en ett har är hur ha på i om för som vilken vilket vilka passar börja barn barnet bebis bebisen bebisar man vi du får mig sig inte gör göra bör behöver the jättemycket mycket'.split(' '));
const norm = s => s.toLowerCase().replace(/[^a-z0-9åäöéü]+/g,' ').trim();
let INDEX = null;
function buildIndex(){
  const idx = [];
  Object.values(ARTICLES).forEach(a=>idx.push({type:'Artiklar', e:a.e||'📄', t:a.title, s:artMeta(a).crumb, go:'article|'+a.id, title:norm(a.title), text:norm(a.tags+' '+a.ingress)}));
  HELP.forEach(h=>idx.push({type:'Snabb hjälp', e:h.e, t:h.t, s:'Lugn vägledning och när du ska söka vård', go:'helpItem|'+h.id, title:norm(h.t), text:norm(h.k+' '+h.intro)}));
  LIST_DEFS.forEach(d=>idx.push({type:'Checklistor', e:d.e, t:d.t, s:'Checklista', go:'list|'+d.id, title:norm(d.t), text:norm((d.id==='bb'?'bb bb väska packa förlossning ha med ':'')+Object.values(d.g).flat().join(' '))}));
  COMPARE.forEach(c=>idx.push({type:'Jämför', e:c.e, t:c.t, s:'Jämför '+c.items.length+' produkter', go:'compareCat|'+c.id, title:norm(c.t), text:norm(c.k+' '+c.items.map(p=>p.b+' '+p.n+' '+p.f.map(f=>NEEDS[f]).join(' ')).join(' '))}));
  RECIPES.forEach(x=>idx.push({type:'Recept', e:x.e, t:x.t, s:`Från ${x.age} mån · ${x.min} min`, go:'recipe|'+x.id, title:norm(x.t), text:norm('recept mat '+x.ing.join(' ')+' '+x.al.join(' '))}));
  return idx;
}
function stem(t){ return t.length<=4 ? t : t.slice(0, Math.max(4, t.length-2)); }
function wmatch(tok, words){ const st = stem(tok); return words.some(w => w.startsWith(st) || (w.length>=4 && tok.startsWith(w))); }
function search(q){
  INDEX = INDEX || buildIndex();
  let toks = norm(q).split(' ').filter(Boolean);
  const content = toks.filter(t=>!STOP.has(t) && t.length>=2);
  if(content.length) toks = content;
  if(!toks.length) return [];
  return INDEX.map(e=>{
    const tw = e.title.split(' '), xw = e.text.split(' ');
    let sc = 0, hits = 0;
    toks.forEach(t=>{ const inT = wmatch(t,tw), inX = wmatch(t,xw); if(inT||inX) hits++; sc += (inT?3:0) + (inX?1:0); });
    if(hits < Math.min(toks.length, toks.length>2 ? 2 : 1)) sc = 0;
    return {e, sc: sc + (hits===toks.length ? 2 : 0)};
  }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).map(x=>x.e);
}
const SUGG = ['Mitt barn bajsar grönt','Vad ska jag ha med till BB?','När kan bebis börja äta ägg?','Vilken bärsele passar nyfödd?','Feber','Sover dåligt'];

  const res = search(q);

}

      <div class="vp-i"><span class="ico">📘</span><div class="row-b"><span class="row-t">Lugn information med tydliga källor</span><span class="row-s">1177, Livsmedelsverket och andra svenska myndigheter</span></div></div>
    </div>
    <div class="stack"><button class="btn block" data-act="obNext">Kom igång</button><button class="btn ghost block" data-act="obDemo">Titta runt med en exempelfamilj</button></div>
  </div>`;
  if(UI.ob===1) return `<div class="ob-wrap view">
    <div class="stack-s">${dots(0)}<span class="eyebrow" style="margin-top:14px">Steg 1 av 2</span><h1>Vad heter du?</h1><p class="lead">Så kan vi hälsa på dig. Du kan hoppa över det här.</p></div>
    <form data-form="obParent" class="stack" style="gap:18px"><div class="field"><label for="ob-name">Ditt förnamn</label><input id="ob-name" name="name" value="${esc(S.parent)}" placeholder="T.ex. Anna" maxlength="30" autocomplete="given-name"></div>
      <button class="btn block" type="submit">Fortsätt</button><button class="btn ghost block" type="button" data-act="obBack">Tillbaka</button></form>
  </div>`;
  if(UI.ob===2) return `<div class="ob-wrap view">
    <div class="stack-s">${dots(1)}<span class="eyebrow" style="margin-top:14px">Steg 2 av 2</span><h1>Berätta om ditt barn</h1><p class="lead">Du kan lägga till fler barn senare under Profil.</p></div>
    ${childFormFields(null, 'Fortsätt', '<button class="btn ghost block" type="button" data-act="obBack">Tillbaka</button>')}
  </div>`;
  const c = activeChild(); const ai = ageInfo(c);
  return `<div class="ob-wrap view">
    <div class="stack-s">${dots(2)}</div>
    <div class="ob-hero" style="background:var(${c.type==='expecting'?'--t-grav':SEC(ai.sec).tint})"><span class="ob-art"></span><span style="font-size:2.4rem">${c.type==='expecting'?'🤰':SEC(ai.sec).e}</span>
      <h1>Klart${S.parent?', '+esc(S.parent):''}!</h1><p class="lead" style="color:var(--text)">Vi har anpassat appen för ${esc(c.name)}, ${esc(ai.kind==='grav'?'graviditetsvecka '+ai.week:ai.label)}.</p></div>
    <button class="btn block" data-act="obDone">Till startsidan</button>
  </div>`;
}

/* ---------------- ROUTER & RENDER ---------------- */
const view = document.getElementById('view');
function parseGo(s){ const [r,a,b,c] = s.split('|'); return {r, a, b, c}; }
function render(scrollTop){
  const ob = !S.onboarded;
  document.body.classList.toggle('ob', ob);
  if(ob){ view.innerHTML = onboarding(); window.scrollTo(0,0); return; }
  const cur = stack[stack.length-1];
  const fn = V[cur.r] || V.home;
  view.innerHTML = fn(cur);
  UI.pulse = false;
  const root = stack[0].r;
  document.querySelectorAll('.tab').forEach(t=>{ if(t.dataset.tab===root) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current'); });
  document.title = 'Hjälp en förälder';
  if(scrollTop === true) window.scrollTo(0,0); else if(typeof scrollTop === 'number') window.scrollTo(0, scrollTop);
  if(cur.r==='search'){ const q = document.getElementById('q'); if(q){ q.focus({preventScroll:true}); q.setSelectionRange(q.value.length, q.value.length); } }
}
function go(s){
  if(s==='onboardingAgain'){ S.onboarded=false; UI.ob=0; render(true); return; }
  const r = parseGo(s);
  if(['home','explore','lists','compare','profile'].includes(r.r) && !r.a){ stack = [{r:r.r}]; render(true); return; }
  stack[stack.length-1].y = window.scrollY;
  if(r.r==='childForm'){ UI.childType=null; UI.err=''; }
  stack.push(r); render(true);
}
function back(){ if(stack.length>1){ stack.pop(); const y = stack[stack.length-1].y||0; render(y); } }
function rerender(){ render(window.scrollY); }

/* ---------------- TOAST ---------------- */
let toastT;
function toast(msg, actLabel, fn){
  const t = document.getElementById('toast'), a = document.getElementById('toastAct');
  document.getElementById('toastMsg').textContent = msg;
  a.hidden = !actLabel; a.textContent = actLabel || ''; a.onclick = () => { t.classList.remove('show'); fn && fn(); };
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), actLabel ? 5000 : 2200);
}

/* ---------------- HÄNDELSER ---------------- */
document.querySelectorAll('.tab').forEach(t=>{ t.querySelector('.pill').innerHTML = icon(t.dataset.ic || t.querySelector('.pill').dataset.ic, 23); t.addEventListener('click', ()=>{ stack=[{r:t.dataset.tab}]; render(true); }); });
document.getElementById('railLogo').innerHTML = LOGO(30);

function curList(){ const cur = stack[stack.length-1]; return cur.r==='list' ? ensureList(cur.a) : null; }

document.addEventListener('click', e=>{
  const tg = e.target.closest('[data-tab-go]'); if(tg){ stack=[{r:tg.dataset.tabGo}]; render(true); return; }
  const rep = e.target.closest('[data-go-replace]'); if(rep){ stack[stack.length-1] = parseGo(rep.dataset.goReplace); rerender(); return; }
  const act = e.target.closest('[data-act]');
  if(act){ handleAct(act.dataset.act, act, e); return; }
  const g = e.target.closest('[data-go]'); if(g){ go(g.dataset.go); }
});

function handleAct(a, el){
  const c = activeChild();
  switch(a){
    case 'back': back(); break;
    case 'setChild': S.active = el.dataset.id; persist(); if(stack[0].r==='profile'){ rerender(); toast('Startsidan visar nu '+(S.children.find(x=>x.id===S.active)||{}).name); } else rerender(); break;
    case 'toggleTodo': { const k = c.id+':'+el.dataset.id; S.todos[k] = !S.todos[k]; persist(); rerender(); break; }
    case 'toggleItem': { const l = curList(); const it = l.items.find(i=>i.id===el.dataset.id); it.done = !it.done; persist(); rerender();
      const p = progress(l); if(it.done && p.pct===100) toast('Allt klart i '+l.t+' 🎉'); break; }
    case 'editMode': { const l = curList(); UI.edit[l.id] = !UI.edit[l.id]; rerender(); break; }
    case 'resetChecks': { const l = curList(); const prev = l.items.map(i=>i.done); l.items.forEach(i=>i.done=false); persist(); rerender();
      toast('Alla punkter avmarkerade', 'Ångra', ()=>{ l.items.forEach((i,k)=>i.done=prev[k]); persist(); rerender(); }); break; }
    case 'restoreList': { const l = curList(); const fresh = makeList(LIST_DEFS.find(d=>d.id===l.id));
      const doneMap = Object.fromEntries(l.items.map(i=>[i.id,i.done]));
      const own = l.items.filter(i=>i.custom);
      l.items = [...fresh.items.map(i=>({...i, done: doneMap[i.id]||false})), ...own]; persist(); rerender(); toast('Rekommenderade punkter återställda'); break; }
    case 'deleteList': { const l = curList(); const snap = JSON.parse(JSON.stringify(l)); const pos = S.order.indexOf(l.id);
      delete S.lists[l.id]; S.order = S.order.filter(x=>x!==l.id); persist(); stack.pop(); rerender();
      toast('Listan togs bort', 'Ångra', ()=>{ S.lists[snap.id]=snap; S.order.splice(pos<0?S.order.length:pos,0,snap.id); persist(); rerender(); }); break; }
    case 'move': { const l = curList(); const it = l.items.find(i=>i.id===el.dataset.id); const grp = l.items.filter(i=>i.g===it.g);
      const gi = grp.indexOf(it), ni = gi + (+el.dataset.dir); if(ni<0||ni>=grp.length) break;
      const other = grp[ni]; const a1 = l.items.indexOf(it), a2 = l.items.indexOf(other); [l.items[a1], l.items[a2]] = [l.items[a2], l.items[a1]];
      persist(); rerender(); const btn = view.querySelector(`[data-act="move"][data-dir="${el.dataset.dir}"][data-id="${it.id}"]`); btn && !btn.disabled && btn.focus(); break; }
    case 'delItem': { const l = curList(); const idx = l.items.findIndex(i=>i.id===el.dataset.id); const [it] = l.items.splice(idx,1); persist(); rerender();
      toast('”'+it.text+'” togs bort', 'Ångra', ()=>{ l.items.splice(idx,0,it); persist(); rerender(); }); break; }
    case 'newList': UI.newList = true; rerender(); setTimeout(()=>{const i=document.getElementById('nl-name'); i&&i.focus();},30); break;
    case 'cancelNewList': UI.newList = false; rerender(); break;
    case 'toggleNeed': { const n = UI.needs[el.dataset.c] = UI.needs[el.dataset.c] || {}; n[el.dataset.n] = !n[el.dataset.n]; rerender(); break; }
    case 'toggleSel': { const s = UI.sel[el.dataset.c] = UI.sel[el.dataset.c] || []; const i = s.indexOf(el.dataset.id);
      if(i>=0) s.splice(i,1); else { if(s.length>=3){ toast('Du kan jämföra högst 3 åt gången'); break; } s.push(el.dataset.id); } rerender(); break; }
    case 'clearSel': UI.sel[el.dataset.c] = []; rerender(); break;
    case 'rf': UI.rf[el.dataset.k] = !UI.rf[el.dataset.k]; rerender(); break;
    case 'sugg': UI.q = el.dataset.q; rerender(); break;
    case 'clearQ': UI.q = ''; rerender(); break;
    case 'setType': { UI.childType = el.dataset.t; UI.err=''; const nm = document.getElementById('cf-name'); const keep = nm ? nm.value : ''; rerenderAny(); const n2 = document.getElementById('cf-name'); if(n2) n2.value = keep; break; }
    case 'deleteChild': { const id = el.dataset.id; const snap = S.children.find(x=>x.id===id); const pos = S.children.indexOf(snap);
      S.children = S.children.filter(x=>x.id!==id); if(S.active===id) S.active = S.children[0] ? S.children[0].id : null; persist(); back();
      toast(snap.name+' togs bort', 'Ångra', ()=>{ S.children.splice(pos,0,snap); if(!S.active) S.active=snap.id; persist(); rerender(); }); break; }
    case 'askReset': UI.confirmReset = true; rerender(); break;
    case 'cancelReset': UI.confirmReset = false; rerender(); break;
    case 'resetAll': S = blankState(); try{localStorage.removeItem(KEY)}catch(e){} UI.confirmReset=false; UI.ob=0; stack=[{r:'home'}]; render(true); break;
    case 'obNext': UI.ob = 1; render(true); break;
    case 'obBack': UI.ob = Math.max(0, UI.ob-1); UI.err=''; render(true); break;
    case 'obDemo': S = demoState(); persist(); stack=[{r:'home'}]; render(true); toast('Du tittar på exempelfamiljen Anna, Elsa och Leo'); break;
    case 'obDone': S.onboarded = true; persist(); stack=[{r:'home'}]; render(true); break;
  }
}
function rerenderAny(){ if(!S.onboarded){ view.innerHTML = onboarding(); } else rerender(); }

document.addEventListener('submit', e=>{
  const f = e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const t = f.dataset.form, fd = new FormData(f);
  if(t==='addItem'){ const text = (fd.get('text')||'').toString().trim(); if(!text) return; const l = curList();
    l.items.push({id:uid('c'), text, done:false, custom:true, g:OWN}); persist(); rerender();
    const inp = document.getElementById('add-'+l.id); inp && inp.focus({preventScroll:true}); toast('”'+text+'” lades till under '+(l.builtin?OWN:'punkter')); }
  if(t==='createList'){ const name = (fd.get('name')||'').toString().trim(); if(!name) return; const id = uid('eget-');
    S.lists[id] = {id, e:'📝', t:name, sec:null, builtin:false, items:[]}; S.order.push(id); UI.newList=false; UI.edit[id]=false; persist(); go('list|'+id);
    setTimeout(()=>{const i=document.getElementById('add-'+id); i&&i.focus();},30); }
  if(t==='parent'){ S.parent = (fd.get('name')||'').toString().trim(); persist(); rerender(); toast('Sparat'); }
  if(t==='obParent'){ S.parent = (fd.get('name')||'').toString().trim(); UI.ob = 2; UI.childType=null; UI.err=''; render(true); }
  if(t==='child'){
    const name = (fd.get('name')||'').toString().trim(), date = (fd.get('date')||'').toString();
    const cur = stack[stack.length-1]; const editing = S.onboarded && cur.r==='childForm' && cur.a ? S.children.find(x=>x.id===cur.a) : null;
    const type = UI.childType || (editing ? editing.type : 'born');
    if(!name){ UI.err = 'Skriv ett namn eller smeknamn.'; return rerenderKeep(name, date); }
    if(!date){ UI.err = type==='born' ? 'Välj barnets födelsedatum.' : 'Välj beräknat förlossningsdatum.'; return rerenderKeep(name, date); }
    if(type==='born' && date > isoToday()){ UI.err = 'Födelsedatumet kan inte vara i framtiden. Väntar ni barn? Välj ”Vi väntar barn”.'; return rerenderKeep(name, date); }
    if(type==='expecting' && date < isoToday()){ UI.err = 'Beräknat datum har redan passerat. Är barnet fött? Välj ”Barnet är fött”.'; return rerenderKeep(name, date); }
    UI.err='';
    if(editing){ Object.assign(editing, {name, date, type}); persist(); back(); toast('Sparat'); return; }
    const c = {id:uid('k'), name, date, type}; S.children.push(c); S.active = c.id; persist();
    if(!S.onboarded){ UI.ob = 3; render(true); } else { stack=[{r:'home'}]; render(true); toast(name+' är tillagd'); }
  }
});
function rerenderKeep(name, date){ rerenderAny(); const n = document.getElementById('cf-name'), d = document.getElementById('cf-date'); if(n) n.value = name; if(d) d.value = date; }

document.addEventListener('input', e=>{
  if(e.target.id==='q'){ UI.q = e.target.value; const r = document.getElementById('results'); if(r) r.innerHTML = resultsHtml(); }
});
document.addEventListener('change', e=>{
  const id = e.target.dataset && e.target.dataset.edit; if(!id) return;
  const l = curList(); const it = l.items.find(i=>i.id===id); const v = e.target.value.trim();
  if(v){ it.text = v; persist(); } else e.target.value = it.text;
});
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.dataset && e.target.dataset.edit){ e.preventDefault(); e.target.blur(); } });

/* Android: telefonens tillbaka-knapp */
window.appBack = function(){
  if(!S.onboarded){ if(UI.ob>0 && UI.ob<3){ UI.ob--; UI.err=''; render(true); return true; } return false; }
  if(stack.length>1){ back(); return true; }
  if(stack[0].r!=='home'){ stack=[{r:'home'}]; render(true); return true; }
  return false;
};
render(true);
</script>
