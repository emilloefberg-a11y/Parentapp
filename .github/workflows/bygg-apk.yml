name: Bygg APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bygg appen
        run: gradle assembleRelease --no-daemon

      - name: Döp om APK-filen
        run: cp app/build/outputs/apk/release/app-release.apk hjalp-en-foralder.apk

      - name: Spara som byggresultat
        uses: actions/upload-artifact@v4
        with:
          name: hjalp-en-foralder-apk
          path: hjalp-en-foralder.apk

      - name: Publicera som testversion (fast nedladdningslänk)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete testversion --yes --cleanup-tag || true
          gh release create testversion hjalp-en-foralder.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Testversion 0.1.${{ github.run_number }}" \
            --notes "Testversion av Hjälp en förälder. Ladda ner hjalp-en-foralder.apk på en Android-telefon och öppna filen för att installera."
